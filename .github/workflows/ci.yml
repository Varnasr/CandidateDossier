name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The repository previously had no CI at all beyond the Pages deploy, so
      # none of these invariants were checked by anything.
      - name: Static checks
        run: node scripts/check.mjs

      # The build script is the Netlify build command. A syntax error in it
      # fails every deploy, which is an expensive place to find out.
      - name: Build script parses
        run: bash -n scripts/fetch-tectonic.sh

      - name: Build script is a no-op without the opt-in flag
        run: |
          set -euo pipefail
          bash scripts/fetch-tectonic.sh
          if [ -e netlify/functions/bin/tectonic ]; then
            echo "fetch-tectonic.sh downloaded the engine without BUILD_COMPILE_FUNCTION=1" >&2
            exit 1
          fi
          echo "PASS - no download without the flag"
